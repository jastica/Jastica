  <!-- Terapkan tema & warna tersimpan sebelum render pertama (tanpa kedip) -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('jst_theme');
        if (!t) t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
        var c = localStorage.getItem('jst_color');
        if (c && /^#[0-9a-f]{6}$/i.test(c)) document.documentElement.style.setProperty('--primary', c);
      } catch (e) { /* penyimpanan lokal tidak tersedia */ }
    })();
    // Penjaga muat (v1.4, GitHub Pages): bila file css/js tidak termuat (404) atau skrip error,
    // tampilkan penyebabnya — bukan layar berputar tanpa akhir.
    (function () {
      var gagal = [], errs = [], shown = false;
      window.__jstFileGagal = function (f) { if (gagal.indexOf(f) === -1) gagal.push(f); if (document.body && /style\.css/.test(f)) setTimeout(tampil, 50); };
      function siap() { return !!window.__APP_READY__; }
      function tampil() {
        var cssGagal = gagal.some(function (f) { return /style\.css/.test(f); });
        if (shown || (siap() && !cssGagal)) return; shown = true;
        var lama = document.getElementById('splash'); if (lama) lama.parentNode.removeChild(lama);
        var sp = document.createElement('div'); sp.id = 'jstMuatGagal'; sp.setAttribute('role', 'alert'); document.body.appendChild(sp);
        sp.style.cssText = 'position:fixed;inset:0;z-index:5000;display:flex;align-items:center;justify-content:center;background:#F6F4FF;overflow:auto';
        var box = document.createElement('div');
        box.style.cssText = 'max-width:620px;margin:16px;padding:22px;border-radius:16px;background:#fff;color:#1F1B2E;box-shadow:0 10px 30px rgba(76,58,191,.15);font:14px/1.55 "Plus Jakarta Sans",system-ui,sans-serif';
        function el(tag, txt, css) { var x = document.createElement(tag); x.textContent = txt; if (css) x.style.cssText = css; box.appendChild(x); return x; }
        var e = errs[0];
        el('div', gagal.length ? 'Sebagian file aplikasi tidak ditemukan' : e ? 'Aplikasi gagal dimuat' : 'Aplikasi belum siap', 'font-size:18px;font-weight:800;margin-bottom:6px;color:#4B3FBF');
        if (gagal.length) {
          el('p', 'File berikut gagal dimuat: ' + gagal.join(', ') + '.', 'margin:0 0 10px;color:#B42318;font-weight:600');
          el('p', 'Pastikan isi repository GitHub sama persis dengan folder frontend: index.html di paling luar, lalu folder css/ (berisi style.css) dan js/ (berisi config.js dan app.js). Unggah lewat terminal (git push), bukan lewat tombol "Upload files" di situs GitHub.', 'margin:0;color:#5B5670');
        } else if (e) {
          el('pre', e.m + ' — ' + e.f + ' baris ' + e.l + ', kolom ' + e.c, 'white-space:pre-wrap;word-break:break-all;background:#F6F3FF;border-radius:10px;padding:10px 12px;font:12px/1.5 ui-monospace,Consolas,monospace;margin:0 0 10px');
          el('p', 'Kirimkan tangkapan layar pesan ini ke pengembang.', 'margin:0;color:#5B5670');
        } else el('p', 'Periksa koneksi internet lalu muat ulang halaman ini.', 'margin:0;color:#5B5670');
        sp.appendChild(box);
      }
      window.addEventListener('error', function (ev) {
        if (siap() || !ev || ev.target !== window && ev.target && ev.target.tagName) return;
        errs.push({ m: String(ev.message || 'Error'), f: String(ev.filename || '').split('/').pop().split('?')[0] || 'skrip', l: ev.lineno || 0, c: ev.colno || 0 });
      });
      document.addEventListener('DOMContentLoaded', function () {
        if (gagal.length) return tampil();
        setTimeout(function () { if (errs.length || gagal.length) tampil(); }, 2500);
        setTimeout(tampil, 45000);
      });
    })();
  </script>

        <div class="pub-actions" id="pubActions"></div>

    <main id="pubMain" class="pub-main">
      <section class="view" id="v-home" aria-label="Beranda"></section>
      <section class="view" id="v-katalog" aria-label="Katalog"></section>
      <section class="view" id="v-keranjang" aria-label="Keranjang"></section>

      <section class="view" id="v-akun" aria-label="Akun saya"></section>
      <section class="view view-auth" id="v-login" aria-label="Masuk"></section>

      <section class="view view-auth" id="v-otp" aria-label="Verifikasi OTP"></section>

    <nav class="bottom-nav d-lg-none" id="pubBottom" aria-label="Navigasi bawah"></nav>
  </div>

  <!-- ═════════════ PANEL INTERNAL ═════════════ -->

      <button class="brand-btn sb-brand" data-go="a-beranda" aria-label="Beranda panel">
        <span class="brand-logo" data-brand-logo></span>
        <span class="brand-text"><b data-brand-name>Jastica</b><small data-brand-tagline>Jasa Titip & Keuangan</small></span>

      <nav class="sb-nav" id="sbNav"></nav>
      <div class="sb-foot">

        <button class="sb-link danger" data-act="logout"><i class="bi bi-box-arrow-right"></i><span>Keluar Sesi</span></button>
      </div>
    </aside>
    <div class="sb-backdrop" data-act="closeSidebar"></div>
    <div class="adm-main">
      <header class="topbar" id="topbar">
        <button class="icon-btn d-xl-none" data-act="openSidebar" aria-label="Buka menu"><i class="bi bi-list"></i></button>

          <div class="dropdown">

            <ul class="dropdown-menu dropdown-menu-end">
              <li><button class="dropdown-item" data-go="a-akun"><i class="bi bi-person-circle me-2"></i>Akun Saya</button></li>
              <li><button class="dropdown-item" data-go="home"><i class="bi bi-shop me-2"></i>Lihat Situs</button></li>

        <section class="view" id="v-a-pengingat"></section>
        <section class="view" id="v-a-laporan"></section>
